services:
  clioaug22build:
    build: .
    image: clioaug22build:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
